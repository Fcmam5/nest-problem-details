name: Main pipeline
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: npm install
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run build # Test build, ain't falling for #16 again
      