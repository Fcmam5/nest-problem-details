name: Main pipeline
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # pnpm honors `pnpm-workspace.yaml`: `minimumReleaseAge` (supply-chain
      # guard), `allowBuilds` (required by pnpm 11 `strictDepBuilds`) and
      # `overrides`. Matches what contributors run locally.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - run: pnpm install
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run test:cov

      - name: Report coverage to Coveralls
        uses: coverallsapp/github-action@v2
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

      - run: pnpm run build # Test build, ain't falling for #16 again
