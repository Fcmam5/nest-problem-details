name: Main pipeline
on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  nest-problem-details-filter:
    defaults:
      run:
        working-directory: libs/nest-problem-details-filter  
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm test
      - run: npm run lint