
name: Release Node.js Package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm'
        type: boolean
        required: true
        default: false
  release:
    types: [published]

jobs:
  build-and-verify:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Same toolchain as `main.yml` and local development; pnpm applies the
      # `pnpm-workspace.yaml` supply-chain and build-script policies.
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: '' # disable built-in caching; managed explicitly via actions/cache below

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - run: pnpm install
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

      - name: Pack tarball (dry-run inspection)
        run: |
          mkdir -p /tmp/pack
          pnpm pack --pack-destination /tmp/pack
          tarball=$(ls /tmp/pack/*.tgz)
          sha256sum "$tarball" > /tmp/pack/sha256sum.txt
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ### Package contents
          \`\`\`
          $(tar -tzf "$tarball")
          \`\`\`
          ### SHA-256
          \`\`\`
          $(cat /tmp/pack/sha256sum.txt)
          \`\`\`
          EOF
          echo "=== Package contents ==="
          tar -tzf "$tarball"
          echo "=== SHA-256 ==="
          cat /tmp/pack/sha256sum.txt

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: /tmp/pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to npm
    needs: build-and-verify
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/nest-problem-details-filter
    permissions:
      contents: read
      id-token: write
    steps:
      # `.nvmrc` is needed for setup-node and `registry-url` only; we publish
      # the verified tarball produced by `build-and-verify`, not the workspace.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: '' # no caching needed in the publish job

      - name: Download verified tarball
        uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: /tmp/pack

      # Publishing stays on npm (not pnpm) for `--provenance` attestations,
      # which npm generates natively from the OIDC token granted above.
      - name: Publish verified tarball to npm
        run: |
          tarball=$(ls /tmp/pack/*.tgz)
          echo "Publishing $tarball"
          npm publish "$tarball" --access public --provenance
